name: e2e-preflight

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "tools/deploy/**"
      - "tools/e2e/**"
      - "packages/connector/**"
      - "packages/server/**"
      - "packages/web/**"
      - "package*.json"
      - ".github/workflows/e2e-preflight.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "tools/deploy/**"
      - "tools/e2e/**"
      - "packages/connector/**"
      - "packages/server/**"
      - "packages/web/**"
      - "package*.json"
      - ".github/workflows/e2e-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - name: 表示言語の選択・補間・端末別通知を確かめる
        run: node --test packages/web/test/i18n.test.ts packages/server/test/locale.test.ts
      - name: 4ハーネスの起動前処理と設定の保持を確かめる（AI起動なし）
        run: node --test tools/e2e/parent-preflight.test.mjs
      - name: アカウント削除と旧DB移行を確かめる（本番利用なし）
        run: node --test packages/server/test/account-deletion.test.ts
      - name: 診断の入力境界・原本保持・集計を確かめる（本番利用なし）
        run: node --test packages/server/test/diagnostics.test.ts
      - name: コネクタの認証境界と公開ペアリングを確かめる（本番利用なし）
        run: node --test packages/server/test/connector-auth.test.ts

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web:browser


  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reject a corrupt archive and a forged checksum manifest
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz -o "$RUNNER_TEMP/node.tar.xz"
          sh tools/deploy/node-release/test-verification.sh "$RUNNER_TEMP/node.tar.xz"
      - name: Build and test with the verified production Node runtime
        run: |
          docker build --platform linux/amd64 --target checks -t approval-box-checks .
          docker build --platform linux/amd64 -t approval-box-runtime .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node approval-box-runtime -e '
            const tls = require("node:tls");
            const { X509Certificate } = require("node:crypto");
            if (process.version !== "v24.22.1") throw new Error(process.version);
            const roots = [...tls.rootCertificates, ...tls.getCACertificates("default")];
            if (roots.some(pem => new X509Certificate(pem).fingerprint256.replaceAll(":", "") === "86A1ECBA089C4A8D3BBE2734C612BA341D813E043CF9E8A862CD5C57A36BBE6B")) throw new Error("emSign G3 remains");
          '
      - name: Boot the product without production data or secrets
        run: docker run --rm -i --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,mode=1777 --cap-drop ALL --security-opt no-new-privileges --entrypoint node approval-box-runtime - < tools/deploy/server-image-smoke.cjs

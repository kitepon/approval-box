# セルフホスト用。PUBLIC_URL を自分の公開URLに変える。
# 利用者のアカウントはAppleかGoogleでの初回ログイン時に作られる。設定はREADMEを参照。
services:
  server:
    build: .
    image: approval-box:local
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      # 鍵を環境変数で渡す時の置き場（tmpfs）。指定すると、入口が鍵をそこのファイルへ移してから起こす。
      SECRETS_DIR: ${SECRETS_DIR:-}
      DIAGNOSTICS_ADMIN_KEY_FILE: ${DIAGNOSTICS_ADMIN_KEY_FILE:-}
      DIAGNOSTICS_ADMIN_KEY: ${DIAGNOSTICS_ADMIN_KEY:-}
      # 管理の鍵の SHA-256（16進）。鍵そのものを置かずに照合する。
      DIAGNOSTICS_ADMIN_KEY_SHA256: ${DIAGNOSTICS_ADMIN_KEY_SHA256:-}
      # 認証モジュール。ソケットのあるフォルダを AUTH_MODULE_DIR で渡し、AUTH_MODULE_SOCKET=/run/auth-module/approval-box.sock にすると、
      # APNs・App Store・Play の署名をモジュールに頼む（鍵の項目名は AUTH_ITEM_APNS・AUTH_ITEM_APPSTORE・AUTH_ITEM_PLAY、既定は approvalbox-apns・approvalbox-appstore・approvalbox-play。空にするとその鍵は環境のまま）。未設定なら環境の鍵で署名する。
      AUTH_MODULE_SOCKET: ${AUTH_MODULE_SOCKET:-}
      AUTH_ITEM_APNS: ${AUTH_ITEM_APNS-approvalbox-apns}
      AUTH_ITEM_APPSTORE: ${AUTH_ITEM_APPSTORE-approvalbox-appstore}
      AUTH_ITEM_PLAY: ${AUTH_ITEM_PLAY-approvalbox-play}
      BILLING: ${BILLING:-off}
      APPLE_AUDIENCES: ${APPLE_AUDIENCES:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      APPLE_WEB_SERVICES_ID: ${APPLE_WEB_SERVICES_ID:-}
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APPSTORE_PRODUCT_IDS: ${APPSTORE_PRODUCT_IDS:-}
      APPSTORE_APP_APPLE_ID: ${APPSTORE_APP_APPLE_ID:-}
      APPSTORE_BUNDLE_ID: ${APPSTORE_BUNDLE_ID:-}
      APPSTORE_ISSUER_ID: ${APPSTORE_ISSUER_ID:-}
      APPSTORE_KEY_ID: ${APPSTORE_KEY_ID:-}
      APPSTORE_PRIVATE_KEY: ${APPSTORE_PRIVATE_KEY:-}
      APPSTORE_PRIVATE_KEY_FILE: ${APPSTORE_PRIVATE_KEY_FILE:-}
      CALL_BRIDGE_CONNECTIONS: ${CALL_BRIDGE_CONNECTIONS:-}
      CALL_BRIDGE_HEADERS_FILE: ${CALL_BRIDGE_HEADERS_FILE:-}
      FREE_ACCOUNT_IDS: ${FREE_ACCOUNT_IDS:-}
      # 共有ライブラリ（login-billing）。LB_K_KEY・LB_PASS_KEY・LB_PASS_KEY_ID が揃った時だけ /auth/v1 で使う。docs/architecture/login-pass.md
      LB_K_KEY: ${LB_K_KEY:-}
      LB_K_KEY_FILE: ${LB_K_KEY_FILE:-}
      LB_PASS_KEY: ${LB_PASS_KEY:-}
      LB_PASS_KEY_FILE: ${LB_PASS_KEY_FILE:-}
      LB_PASS_KEY_ID: ${LB_PASS_KEY_ID:-}
      LB_PASS_KEY_PREVIOUS: ${LB_PASS_KEY_PREVIOUS:-}
      LB_PASS_KEY_PREVIOUS_FILE: ${LB_PASS_KEY_PREVIOUS_FILE:-}
      LB_PASS_KEY_PREVIOUS_ID: ${LB_PASS_KEY_PREVIOUS_ID:-}
      # Google の id だけで入る道（試験サーバーだけ）。両方そろった時だけ有効。
      LB_GOOGLE_CODE_CLIENT_ID: ${LB_GOOGLE_CODE_CLIENT_ID:-}
      LB_GOOGLE_CODE_CLIENT_SECRET: ${LB_GOOGLE_CODE_CLIENT_SECRET:-}
      LB_GOOGLE_CODE_CLIENT_SECRET_FILE: ${LB_GOOGLE_CODE_CLIENT_SECRET_FILE:-}
      # Web サインイン（契約1.20）。Google は Web 種のクライアント、Apple は Services ID・Team ID・鍵ID・.p8。そろった方だけ。
      LB_OLD_HANDOFF: ${LB_OLD_HANDOFF:-}
      LB_WEB_GOOGLE_CLIENT_ID: ${LB_WEB_GOOGLE_CLIENT_ID:-}
      LB_WEB_GOOGLE_CLIENT_SECRET: ${LB_WEB_GOOGLE_CLIENT_SECRET:-}
      LB_WEB_GOOGLE_CLIENT_SECRET_FILE: ${LB_WEB_GOOGLE_CLIENT_SECRET_FILE:-}
      LB_WEB_APPLE_SERVICES_ID: ${LB_WEB_APPLE_SERVICES_ID:-}
      LB_WEB_APPLE_TEAM_ID: ${LB_WEB_APPLE_TEAM_ID:-}
      LB_WEB_APPLE_KEY_ID: ${LB_WEB_APPLE_KEY_ID:-}
      LB_WEB_APPLE_PRIVATE_KEY: ${LB_WEB_APPLE_PRIVATE_KEY:-}
      LB_WEB_APPLE_PRIVATE_KEY_FILE: ${LB_WEB_APPLE_PRIVATE_KEY_FILE:-}
      LB_REKEY_DELETE_IDS: ${LB_REKEY_DELETE_IDS:-}
      # 申請の中身を封にする鍵の窓（docs/architecture/storage-lifecycle.md「Sealed content」）。上の AUTH_MODULE_SOCKET があれば認証モジュール（項目 approvalbox-data の wrap・unwrap）、
      # 無ければ ABX_DATA_KEY（base64の32バイト）。どちらも無ければ新しい申請は503。
      ABX_DATA_KEY: ${ABX_DATA_KEY:-}
      ABX_DATA_KEY_FILE: ${ABX_DATA_KEY_FILE:-}
      # アプリのリンク（/.well-known、Webサインインの戻り /app/websignin）。形は docs/architecture/login-pass.md。無ければ404。
      AB_ANDROID_APP_LINKS: ${AB_ANDROID_APP_LINKS:-}
      AB_APPLE_APP_IDS: ${AB_APPLE_APP_IDS:-}
      # peer-channel の TURN（/pc/v1/turn）。両方そろった時だけ。無ければ urls は空。docs/architecture/peer-channel-adoption.md
      PC_OFFER: ${PC_OFFER:-}
      PC_TURN_SECRET: ${PC_TURN_SECRET:-}
      PC_TURN_SECRET_FILE: ${PC_TURN_SECRET_FILE:-}
      PC_TURN_URLS: ${PC_TURN_URLS:-}
      PC_TURN_CF_KEY_ID: ${PC_TURN_CF_KEY_ID:-}
      PC_TURN_CF_API_TOKEN: ${PC_TURN_CF_API_TOKEN:-}
      PC_TURN_CF_API_TOKEN_FILE: ${PC_TURN_CF_API_TOKEN_FILE:-}
      PLAY_PRODUCT_IDS: ${PLAY_PRODUCT_IDS:-}
      PLAY_PACKAGE_NAME: ${PLAY_PACKAGE_NAME:-}
      PLAY_CLIENT_EMAIL: ${PLAY_CLIENT_EMAIL:-}
      PLAY_PRIVATE_KEY: ${PLAY_PRIVATE_KEY:-}
      PLAY_PRIVATE_KEY_FILE: ${PLAY_PRIVATE_KEY_FILE:-}
      PLAY_PUSH_AUDIENCE: ${PLAY_PUSH_AUDIENCE:-}
      PLAY_PUSH_SERVICE_ACCOUNT: ${PLAY_PUSH_SERVICE_ACCOUNT:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      CALL_BRIDGE_HEADERS: ${CALL_BRIDGE_HEADERS:-}
      CALL_BRIDGE_URL: ${CALL_BRIDGE_URL:-}
      CALL_BRIDGE_LOCAL_SYSTEM: ${CALL_BRIDGE_LOCAL_SYSTEM:-}
      CALL_BRIDGE_LOCAL_ID: ${CALL_BRIDGE_LOCAL_ID:-}
      CALL_BRIDGE_MEMBER_SYSTEM: ${CALL_BRIDGE_MEMBER_SYSTEM:-}
    ports:
      - "${BIND:-127.0.0.1}:${HOST_PORT:-8787}:8787"
    volumes:
      - data:/data
      # 認証モジュールの呼び元のフォルダ（ソケットのファイルでなくフォルダを読み書きで渡す）。未設定なら使われない空のフォルダ。
      - ${AUTH_MODULE_DIR:-./.auth-module-unused}:/run/auth-module
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  data:

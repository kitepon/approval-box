# セルフホスト用。PUBLIC_URL を自分の公開URLに変える。
# 利用者のアカウントはAppleかGoogleでの初回ログイン時に作られる。設定はREADMEを参照。
services:
  server:
    build: .
    image: approval-box:local
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      # 鍵を環境変数で渡す時の置き場（tmpfs）。指定すると、入口が鍵をそこのファイルへ移してから起こす。
      SECRETS_DIR: ${SECRETS_DIR:-}
      DIAGNOSTICS_ADMIN_KEY_FILE: ${DIAGNOSTICS_ADMIN_KEY_FILE:-}
      DIAGNOSTICS_ADMIN_KEY: ${DIAGNOSTICS_ADMIN_KEY:-}
      BILLING: ${BILLING:-off}
      APPLE_AUDIENCES: ${APPLE_AUDIENCES:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      APPLE_WEB_SERVICES_ID: ${APPLE_WEB_SERVICES_ID:-}
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APPSTORE_PRODUCT_IDS: ${APPSTORE_PRODUCT_IDS:-}
      APPSTORE_APP_APPLE_ID: ${APPSTORE_APP_APPLE_ID:-}
      APPSTORE_BUNDLE_ID: ${APPSTORE_BUNDLE_ID:-}
      APPSTORE_ISSUER_ID: ${APPSTORE_ISSUER_ID:-}
      APPSTORE_KEY_ID: ${APPSTORE_KEY_ID:-}
      APPSTORE_PRIVATE_KEY: ${APPSTORE_PRIVATE_KEY:-}
      APPSTORE_PRIVATE_KEY_FILE: ${APPSTORE_PRIVATE_KEY_FILE:-}
      CALL_BRIDGE_CONNECTIONS: ${CALL_BRIDGE_CONNECTIONS:-}
      CALL_BRIDGE_HEADERS_FILE: ${CALL_BRIDGE_HEADERS_FILE:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_SECRET_KEY_FILE: ${STRIPE_SECRET_KEY_FILE:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_WEBHOOK_SECRET_FILE: ${STRIPE_WEBHOOK_SECRET_FILE:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      FREE_ACCOUNT_IDS: ${FREE_ACCOUNT_IDS:-}
      STRIPE_PORTAL_CONFIGURATION: ${STRIPE_PORTAL_CONFIGURATION:-}
      PLAY_PRODUCT_IDS: ${PLAY_PRODUCT_IDS:-}
      PLAY_PACKAGE_NAME: ${PLAY_PACKAGE_NAME:-}
      PLAY_CLIENT_EMAIL: ${PLAY_CLIENT_EMAIL:-}
      PLAY_PRIVATE_KEY: ${PLAY_PRIVATE_KEY:-}
      PLAY_PRIVATE_KEY_FILE: ${PLAY_PRIVATE_KEY_FILE:-}
      PLAY_PUSH_AUDIENCE: ${PLAY_PUSH_AUDIENCE:-}
      PLAY_PUSH_SERVICE_ACCOUNT: ${PLAY_PUSH_SERVICE_ACCOUNT:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      CALL_BRIDGE_HEADERS: ${CALL_BRIDGE_HEADERS:-}
      CALL_BRIDGE_URL: ${CALL_BRIDGE_URL:-}
      CALL_BRIDGE_LOCAL_SYSTEM: ${CALL_BRIDGE_LOCAL_SYSTEM:-}
      CALL_BRIDGE_LOCAL_ID: ${CALL_BRIDGE_LOCAL_ID:-}
      CALL_BRIDGE_MEMBER_SYSTEM: ${CALL_BRIDGE_MEMBER_SYSTEM:-}
    ports:
      - "${BIND:-127.0.0.1}:${HOST_PORT:-8787}:8787"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  data:

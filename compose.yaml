# セルフホスト用。PUBLIC_URL を自分の公開URLに変える。
# 最初の管理者: docker compose exec server node server/dist/main.js admin create-user
services:
  server:
    build: .
    image: approval-box:local
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      BILLING: ${BILLING:-off}
      APPLE_AUDIENCES: ${APPLE_AUDIENCES:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      APPLE_WEB_SERVICES_ID: ${APPLE_WEB_SERVICES_ID:-}
      APNS_KEY: ${APNS_KEY:-}
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_TOPIC: ${APNS_TOPIC:-}
      APPSTORE_PRODUCT_IDS: ${APPSTORE_PRODUCT_IDS:-}
      APPSTORE_APP_APPLE_ID: ${APPSTORE_APP_APPLE_ID:-}
      APPSTORE_BUNDLE_ID: ${APPSTORE_BUNDLE_ID:-}
      CALL_BRIDGE_CONNECTIONS: ${CALL_BRIDGE_CONNECTIONS:-}
      CALL_BRIDGE_HEADERS_FILE: ${CALL_BRIDGE_HEADERS_FILE:-}
      CALL_BRIDGE_URL: ${CALL_BRIDGE_URL:-}
      CALL_BRIDGE_LOCAL_ID: ${CALL_BRIDGE_LOCAL_ID:-}
      CALL_BRIDGE_MEMBER_SYSTEM: ${CALL_BRIDGE_MEMBER_SYSTEM:-}
    ports:
      - "${BIND:-127.0.0.1}:${HOST_PORT:-8787}:8787"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  data:
